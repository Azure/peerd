name: Kind CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  e2eBlobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prerequisites
        run: sudo make tests-deps-install

      - name: "End to End: Blobs"
        run: make ci-kind-random

      - name: "Clean up"
        run: make kind-delete
